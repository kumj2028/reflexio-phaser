<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Reflexio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
      color: #eee;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }
    canvas {
      touch-action: none;
    }

    /* Portrait overlay — asks the user to rotate */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      color: #eee;
      font-family: monospace;
      font-size: 20px;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      gap: 16px;
    }
    #rotate-prompt svg {
      width: 64px;
      height: 64px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @media (orientation: portrait) {
      #rotate-prompt { display: flex; }
      #game          { visibility: hidden; }
    }
  </style>
</head>
<body>
  <div id="rotate-prompt">
    <svg viewBox="0 0 24 24" fill="none" stroke="#eee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18h.01"/>
    </svg>
    <div>Please rotate your device<br>to landscape mode</div>
  </div>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Request landscape lock via Screen Orientation API where supported.
    function lockLandscape() {
      try {
        screen.orientation?.lock('landscape').catch(() => {});
      } catch { /* unsupported */ }
    }
    document.addEventListener('DOMContentLoaded', lockLandscape);
    document.addEventListener('click', lockLandscape, { once: true });
    document.addEventListener('touchstart', lockLandscape, { once: true });

    // Block all browser touch gestures (scroll, zoom) globally.
    document.addEventListener('touchstart',  (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove',   (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchend',    (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart',(e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
