<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Reflexio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
      color: #eee;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }
    canvas {
      touch-action: none;
    }

    /* Fullscreen toggle — top right corner, above every overlay */
    #fs-btn {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 10001;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background: rgba(50, 50, 50, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      color: #fff;
      opacity: 0.82;
      cursor: pointer;
      touch-action: none;
    }
    #fs-btn:hover { opacity: 1; }
    #fs-btn svg { width: 18px; height: 18px; display: block; }
    #fs-btn .fs-exit  { display: none; }
    body.is-fullscreen #fs-btn .fs-enter { display: none; }
    body.is-fullscreen #fs-btn .fs-exit  { display: block; }

    /* Portrait overlay — asks the user to rotate */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      color: #eee;
      font-family: monospace;
      font-size: 20px;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      gap: 16px;
    }
    #rotate-prompt svg {
      width: 64px;
      height: 64px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @media (orientation: portrait) {
      #rotate-prompt { display: flex; }
      #game          { visibility: hidden; }
      #fs-btn        { display: none; }
    }
  </style>
</head>
<body>
  <div id="rotate-prompt">
    <svg viewBox="0 0 24 24" fill="none" stroke="#eee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18h.01"/>
    </svg>
    <div>Please rotate your device<br>to landscape mode</div>
  </div>
  <div id="game"></div>
  <div id="fs-btn" role="button" aria-label="Toggle fullscreen" title="Fullscreen">
    <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>
    </svg>
    <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>
    </svg>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    const fsBtn = document.getElementById('fs-btn');

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    // Fullscreen the whole document, not just the canvas: the D-pad and button
    // overlays are DOM siblings of the canvas and must come along.
    function goFullscreen() {
      if (isFullscreen()) return;
      const el = document.documentElement;
      try {
        (el.requestFullscreen?.() ?? el.webkitRequestFullscreen?.())
          ?.catch(() => {});
      } catch { /* unsupported */ }
      try {
        screen.orientation?.lock('landscape').catch(() => {});
      } catch { /* unsupported */ }
    }

    function exitFullscreen() {
      try {
        (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.())
          ?.catch(() => {});
      } catch { /* unsupported */ }
    }

    // Enter fullscreen + lock landscape on first gesture.
    document.addEventListener('click',      goFullscreen, { once: true });
    document.addEventListener('touchstart', goFullscreen, { once: true });
    document.addEventListener('keydown',    goFullscreen, { once: true });

    // Hide the button where the browser cannot go fullscreen at all (iOS Safari).
    if (!document.documentElement.requestFullscreen &&
        !document.documentElement.webkitRequestFullscreen) {
      fsBtn.style.display = 'none';
    }

    // pointerdown, not click: the global touch handlers below swallow clicks on
    // touch devices, and a fullscreen request needs a live user gesture.
    fsBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (isFullscreen()) exitFullscreen(); else goFullscreen();
    }, { passive: false });

    function syncFsBtn() {
      document.body.classList.toggle('is-fullscreen', isFullscreen());
      fsBtn.title = isFullscreen() ? 'Exit fullscreen' : 'Fullscreen';
    }
    document.addEventListener('fullscreenchange',       syncFsBtn);
    document.addEventListener('webkitfullscreenchange', syncFsBtn);
    syncFsBtn();

    // Block all browser touch gestures (scroll, zoom) globally.
    document.addEventListener('touchstart',  (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove',   (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchend',    (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart',(e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
