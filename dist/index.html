<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Reflexio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
      color: #eee;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
      /* dvh tracks the viewport Safari actually leaves below its URL bar.
         Declared second so browsers without dvh keep the vh value above. */
      height: 100dvh;
      position: relative;
      touch-action: none;
    }
    canvas {
      touch-action: none;
    }

    /* Fullscreen toggle — top right corner, above every overlay */
    #fs-btn {
      position: fixed;
      /* viewport-fit=cover means no automatic insets: in landscape the notch and
         rounded corners sit exactly where this button goes, so inset manually. */
      top: calc(8px + env(safe-area-inset-top, 0px));
      right: calc(8px + env(safe-area-inset-right, 0px));
      z-index: 10001;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      background: rgba(50, 50, 50, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      color: #fff;
      opacity: 0.82;
      cursor: pointer;
      touch-action: none;
    }
    #fs-btn:hover { opacity: 1; }
    #fs-btn svg { width: 18px; height: 18px; display: block; }

    /* Touch screens need a finger-sized target. */
    @media (pointer: coarse) {
      #fs-btn { width: 44px; height: 44px; opacity: 0.9; }
      #fs-btn svg { width: 24px; height: 24px; }
    }
    #fs-btn .fs-exit  { display: none; }
    body.is-fullscreen #fs-btn .fs-enter { display: none; }
    body.is-fullscreen #fs-btn .fs-exit  { display: block; }

    /* Install hint — the only route to fullscreen on iPhone */
    #fs-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10002;
      background: rgba(0, 0, 0, 0.88);
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #fs-hint.show { display: flex; }
    #fs-hint .panel {
      max-width: 420px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      background: #141414;
      padding: 20px 22px;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
    #fs-hint h2 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: 0.04em;
    }
    #fs-hint p { margin: 0 0 14px; color: #bbb; }
    #fs-hint .share {
      display: inline-block;
      vertical-align: -3px;
      width: 15px;
      height: 15px;
    }
    #fs-hint .ok {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      background: rgba(50, 50, 50, 0.9);
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
    }

    /* Portrait overlay — asks the user to rotate */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      color: #eee;
      font-family: monospace;
      font-size: 20px;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      gap: 16px;
    }
    #rotate-prompt svg {
      width: 64px;
      height: 64px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @media (orientation: portrait) {
      #rotate-prompt { display: flex; }
      #game          { visibility: hidden; }
      #fs-btn        { display: none; }
    }
  </style>
  <script type="module" crossorigin src="/reflexio-phaser/assets/index-DpBB6mNr.js"></script>
<link rel="manifest" href="/reflexio-phaser/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/reflexio-phaser/registerSW.js"></script></head>
<body>
  <div id="rotate-prompt">
    <svg viewBox="0 0 24 24" fill="none" stroke="#eee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18h.01"/>
    </svg>
    <div>Please rotate your device<br>to landscape mode</div>
  </div>
  <div id="game"></div>
  <div id="fs-btn" role="button" aria-label="Toggle fullscreen" title="Fullscreen">
    <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/>
    </svg>
    <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/>
    </svg>
  </div>
  <div id="fs-hint">
    <div class="panel">
      <h2>FULLSCREEN ON IPHONE</h2>
      <p>iPhone Safari cannot put a game fullscreen &mdash; it only allows it for
         video. To play without the address bar, add Reflexio to your home screen
         and launch it from there:</p>
      <p>Tap
         <svg class="share" viewBox="0 0 24 24" fill="none" stroke="#7ab8ff"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M12 16V3m0 0L8 7m4-4 4 4"/>
           <path d="M4 14v6a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-6"/>
         </svg>
         Share, then <b>Add to Home Screen</b>.</p>
      <div class="ok" id="fs-hint-ok">GOT IT</div>
    </div>
  </div>
  <script>
    const fsBtn = document.getElementById('fs-btn');

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    // Fullscreen the whole document, not just the canvas: the D-pad and button
    // overlays are DOM siblings of the canvas and must come along.
    function goFullscreen() {
      if (isFullscreen()) return;
      const el = document.documentElement;
      try {
        (el.requestFullscreen?.() ?? el.webkitRequestFullscreen?.())
          ?.catch(() => {});
      } catch { /* unsupported */ }
      try {
        screen.orientation?.lock('landscape').catch(() => {});
      } catch { /* unsupported */ }
    }

    function exitFullscreen() {
      try {
        (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.())
          ?.catch(() => {});
      } catch { /* unsupported */ }
    }

    // Enter fullscreen + lock landscape on first gesture.
    document.addEventListener('click',      goFullscreen, { once: true });
    document.addEventListener('touchstart', goFullscreen, { once: true });
    document.addEventListener('keydown',    goFullscreen, { once: true });

    // Element.requestFullscreen on iOS is iPad-only and has never shipped on
    // iPhone, so feature-detect rather than sniff the user agent. The native
    // video player uses webkitEnterFullscreen, which a canvas cannot borrow.
    const canFullscreen = !!(document.documentElement.requestFullscreen ||
                             document.documentElement.webkitRequestFullscreen);

    // Launched from the home screen: already fullscreen, nothing to toggle.
    const isStandalone = !!navigator.standalone ||
      window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;

    const fsHint = document.getElementById('fs-hint');
    document.getElementById('fs-hint-ok').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      fsHint.classList.remove('show');
    }, { passive: false });

    if (isStandalone) fsBtn.style.display = 'none';

    // pointerdown, not click: the global touch handlers below swallow clicks on
    // touch devices, and a fullscreen request needs a live user gesture.
    fsBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!canFullscreen) { fsHint.classList.add('show'); return; }
      if (isFullscreen()) exitFullscreen(); else goFullscreen();
    }, { passive: false });

    function syncFsBtn() {
      document.body.classList.toggle('is-fullscreen', isFullscreen());
      fsBtn.title = isFullscreen() ? 'Exit fullscreen' : 'Fullscreen';
    }
    document.addEventListener('fullscreenchange',       syncFsBtn);
    document.addEventListener('webkitfullscreenchange', syncFsBtn);
    syncFsBtn();

    // Block all browser touch gestures (scroll, zoom) globally.
    document.addEventListener('touchstart',  (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove',   (e) => e.preventDefault(), { passive: false });
    document.addEventListener('touchend',    (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart',(e) => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
